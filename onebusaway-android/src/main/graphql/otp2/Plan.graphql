# OTP 2.x GraphQL trip-plan query (issue #1780). Field names verified against the vendored
# schema.graphqls (pinned to OpenTripPlanner v2.9.0) in this directory. Deliberately avoids every
# field marked @deprecated in that schema (e.g. Place.vertexType, Leg.arrivalDelay/departureDelay,
# Itinerary.start/endTime) so Apollo's generated code stays warning-free under this repo's
# -PwarningsAsErrors=true CI gate.
#
# PlaceFields is shared by Leg.from/Leg.to (both type Place) so Apollo generates one type — and
# Otp2PlanAdapters.kt maps it with one function — instead of two structurally-identical copies.
fragment PlaceFields on Place {
    name
    lat
    lon
    stop { gtfsId code }
    rentalVehicle { vehicleId name }
    vehicleParking { vehicleParkingId name }
    vehicleRentalStation { stationId name }
}

# RouteFields is the planned leg's route. AlternativeRouteFields is the deliberately smaller set an
# alternative leg needs (below): a plan asks for alternatives on every transit leg of every itinerary,
# so each field there is paid for many times over — it carries only what names the route and what
# resolves it onto an OBA id. `longName` is part of naming it: a route that publishes no short name
# has nothing else to be called, and its id is not a name. Agency `timezone` stays the omission.
fragment RouteFields on Route {
    gtfsId
    shortName
    longName
    color
    agency { gtfsId name timezone }
}

fragment AlternativeRouteFields on Route {
    gtfsId
    shortName
    longName
    color
    agency { gtfsId name }
}

query Plan(
    $origin: PlanLabeledLocationInput!
    $destination: PlanLabeledLocationInput!
    $dateTime: PlanDateTimeInput
    $modes: PlanModesInput
    $preferences: PlanPreferencesInput
    $numItineraries: Int!
    $alternativeLegs: Int!
) {
    planConnection(
        origin: $origin
        destination: $destination
        dateTime: $dateTime
        first: $numItineraries
        modes: $modes
        preferences: $preferences
    ) {
        searchDateTime
        routingErrors {
            code
            description
            inputField
        }
        edges {
            node {
                start
                end
                duration
                numberOfTransfers
                legs {
                    mode
                    duration
                    distance
                    realTime
                    interlineWithPreviousLeg
                    start {
                        scheduledTime
                        estimated { time delay }
                    }
                    end {
                        scheduledTime
                        estimated { time delay }
                    }
                    from {
                        ...PlaceFields
                    }
                    to {
                        ...PlaceFields
                    }
                    route {
                        ...RouteFields
                    }
                    trip {
                        gtfsId
                        tripHeadsign
                    }
                    # Ordered calls include both board and alight. The reminder plan builder consumes
                    # this same normalized stop list for OTP1 and OTP2, so incomplete legs fail as one
                    # user-visible validation error rather than starting partial reminder coverage.
                    stopCalls {
                        stopLocation {
                            ... on Stop { gtfsId name lat lon code }
                        }
                    }
                    # Interleaved/interchangeable routes (#2010): OTP's own alternative-leg search,
                    # which returns the next departures that serve this leg's *exact* board and alight
                    # stops on ANY route (the GTFS GraphQL API runs it with
                    # AlternativeLegsFilter.NO_FILTER — verified in OTP's LegImpl.alternativeLegs), so
                    # a corridor's other lines come back alongside later trips of this leg's own route.
                    # The parent-station arguments are deliberately omitted: their default keeps the
                    # search on the exact stops, so an alternative is boardable at the very stop the
                    # drawer tells the rider to wait at — never a sibling platform across the station.
                    # Null for a non-transit leg (OTP returns no alternatives rather than an error).
                    # Which of these are actually interchangeable is decided by InterchangeableRoutes.kt,
                    # not here; this is the raw candidate set.
                    nextLegs(numberOfLegs: $alternativeLegs) {
                        duration
                        route {
                            ...AlternativeRouteFields
                        }
                        trip {
                            tripHeadsign
                        }
                        from { stop { gtfsId } }
                        to { stop { gtfsId } }
                    }
                    # Service alerts OTP itself considers applicable to this leg (#2143) — the ones the
                    # rider needs before they trust the itinerary, e.g. "1 Line service is suspended
                    # from Capitol Hill Station to Stadium Station". OTP scopes them two ways, and
                    # both are the server's call, not this client's: to the entities the leg actually
                    # uses (its route/trip/stops), and to the leg's own time window — verified against
                    # the live server, where an alert whose active period ends today attaches to a leg
                    # planned for today and not to the same leg planned for next week, while an
                    # open-ended one attaches to both. So there is no active-window check on the client
                    # side of this field.
                    #
                    # `alertHeaderText`/`alertDescriptionText`/`alertUrl` are the language-negotiated
                    # singular forms; their `*Translations` siblings are @deprecated in the vendored
                    # schema and would fail this repo's -PwarningsAsErrors gate.
                    alerts {
                        id
                        alertHeaderText
                        alertDescriptionText
                        alertUrl
                        alertSeverityLevel
                    }
                    legGeometry {
                        points
                        length
                    }
                    steps {
                        relativeDirection
                        absoluteDirection
                        streetName
                        distance
                        exit
                        stayOn
                        lat
                        lon
                    }
                }
            }
        }
    }
}
